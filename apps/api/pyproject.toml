[project]
name = "reclutamiento-api"
version = "0.1.0"
description = "API del Sistema Integral de Reclutamiento e Inteligencia Artificial"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "pyodbc>=5.1",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["app"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.setuptools.packages.find]
include = ["app*"]
