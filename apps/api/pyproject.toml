[project]
name = "reclutamiento-api"
version = "0.1.0"
description = "API del Sistema Integral de Reclutamiento e Inteligencia Artificial"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "pyodbc>=5.1",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "celery>=5.4",
    "redis>=5.0",
    # Lectura de CV en PDF y generación del Excel de evaluación.
    "pypdf>=5.0",
    "openpyxl>=3.1",
    # Lectura de documentos escaneados: convierte páginas de PDF en imagen
    # para Tesseract, que se instala en el servidor (no es un paquete de Python).
    "pypdfium2>=4.30",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["app"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.per-file-ignores]
# Las pruebas usan contraseñas ficticias a propósito.
"**/tests/**" = ["S105", "S106"]
