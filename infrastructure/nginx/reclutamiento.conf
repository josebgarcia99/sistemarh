# Proxy inverso de ejemplo para producción (nginx).
#
# NO VERIFICADO: propuesta para Sistemas. Ajustar el nombre del servidor y revisar
# con el certificado real antes de usarlo.
#
# - Todo el tráfico va por HTTPS; el puerto 80 solo redirige.
# - /api/ se entrega a la API; lo demás, a las pantallas.
# - Admite cargas de hasta 25 MB (la API aplica el límite real de 20 MB).

server_tokens off;

# Límite de intentos de inicio de sesión por dirección IP (además del bloqueo
# de cuenta que ya hace la aplicación).
limit_req_zone $binary_remote_addr zone=inicio_sesion:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/servidor.crt;
    ssl_certificate_key /etc/nginx/tls/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Se sustituye lo que envíe el cliente: la aplicación confía solo en este valor.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location = /api/v1/auth/login {
        limit_req zone=inicio_sesion burst=5 nodelay;
        proxy_pass http://api:8000;
    }

    # Las métricas del proceso solo se consultan desde la red interna.
    location = /api/v1/system/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
        # Una carga grande o una llamada a la IA pueden tardar.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
